name: Daily concert scraping

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Before the scrape: once names like "Morat - YEM World Tour" are fixed,
      # reprocessed rows dedupe to the renamed artist instead of creating a
      # second one. Idempotent; never merges or deletes.
      - name: Clean artist names
        continue-on-error: true
        run: npm run artists:cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run weekly scrape
        run: npm run scrape:weekly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONCURRENCY: "3"
          SCRAPER_TIMEOUT_MS: "30000"
          ENABLE_AI_NORMALIZATION: "false"
          SCRAPER_CITY_ALLOWLIST: "Madrid,Barcelona,Sevilla,Valencia,Bilbao,Granada,Murcia,San Sebastián,Santander,Vigo,Zaragoza"

      - name: Enrich images (event posters, artist photos)
        if: always()
        continue-on-error: true
        run: npm run enrich:images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Posters of upcoming concerts copied to R2 as two small WebP files
      # (events.poster_thumb_url / poster_url). Only new or changed image URLs
      # are downloaded; failures are retried on later runs (up to 5 times).
      # Respects the shared R2 storage cap. Logs a warning and does nothing
      # while the R2_* secrets are not set in this repository.
      - name: Mirror event posters to R2
        if: always()
        continue-on-error: true
        run: npm run posters:mirror -- --apply --limit 600
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_JURISDICTION: ${{ secrets.R2_JURISDICTION }}
          R2_MAX_STORED_BYTES: ${{ secrets.R2_MAX_STORED_BYTES }}

      # Files of deleted accounts (media_deletion_queue, filled by
      # delete_my_account()). R2 objects are deleted with the R2_* secrets;
      # Cloudinary ones only if CLOUDINARY_* secrets exist, otherwise they
      # stay queued. Logs and exits 0 while the table or secrets are missing.
      - name: Delete media of deleted accounts
        if: always()
        continue-on-error: true
        run: npm run media:drain-deletions -- --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_JURISDICTION: ${{ secrets.R2_JURISDICTION }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      # Artist links (Spotify, Instagram, YouTube…) from MusicBrainz. Only
      # fills empty links; ~1 request per second.
      - name: Enrich artist links
        if: always()
        continue-on-error: true
        run: npm run enrich:links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Styles for artists (Deezer albums, then the nights they lead) and
      # upcoming concerts (venue tags + artists). Only fills empty genres.
      - name: Enrich genres
        if: always()
        continue-on-error: true
        run: npm run enrich:genres
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Setlists for concerts of the last 3 days that still have none. Skips
      # itself (one log line) when the SETLISTFM_API_KEY secret is not set.
      - name: Fallback setlists from setlist.fm
        if: always()
        continue-on-error: true
        run: npm run setlists:fallback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}

      # Coordinates for new venues without them, so they show on the map.
      - name: Geocode venues without coordinates
        if: always()
        continue-on-error: true
        run: npm run venues:geocode -- --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Resolve obsolete watcher alerts
        if: always()
        run: npm run scrape:maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
