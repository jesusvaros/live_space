name: Publish public web

# Rebuilds the prerendered agenda after each daily scrape and shortly after
# midnight in Madrid, so /hoy and /esta-semana never show a stale day, and
# deploys it to Vercel (setup: docs/runbooks.md, "Web pública en Vercel").

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily concert scraping"]
    types: [completed]
  schedule:
    - cron: "5 23 * * *"

permissions:
  contents: read

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      # Empty means the default in src/shared/siteUrl.ts.
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_LEGAL_OWNER: ${{ vars.VITE_LEGAL_OWNER }}
      VITE_ANDROID_URL: ${{ vars.VITE_ANDROID_URL }}
      VITE_IOS_URL: ${{ vars.VITE_IOS_URL }}

    steps:
      - name: Check Vercel configuration
        id: configured
        shell: bash
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Web no publicada::Faltan secretos:$missing. Ver docs/runbooks.md (Web pública en Vercel)."
            echo "### Web no publicada" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan secretos:$missing. Ver docs/runbooks.md (Web pública en Vercel)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.configured.outputs.ready == 'true'
        run: npm ci

      - name: Build and prerender
        if: steps.configured.outputs.ready == 'true'
        run: npm run web:prerender

      # dist-site is the finished static site (vercel.json included); the
      # project has no build step on Vercel. VERCEL_ORG_ID/VERCEL_PROJECT_ID
      # pick the project without a committed .vercel/ folder.
      - name: Deploy to Vercel
        if: steps.configured.outputs.ready == 'true'
        run: npx --yes vercel@65.3.1 deploy dist-site --prod --yes --token "$VERCEL_TOKEN"
