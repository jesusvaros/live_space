project_id = "live-space"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "com.livespace.app://**"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Branded emails (supabase/templates). Production uses the same HTML, pasted
# in Dashboard → Authentication → Emails; see docs/runbooks.md.
[auth.email.template.confirmation]
subject = "Confirma tu cuenta de Live Space"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Tu nueva contraseña de Live Space"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Tu enlace para entrar en Live Space"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo email en Live Space"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Te esperan en Live Space"
content_path = "./supabase/templates/invite.html"

[functions.cloudinary-sign-upload]
verify_jwt = true

[functions.cloudinary-webhook]
verify_jwt = false

[functions.social-oembed]
verify_jwt = true

[functions.media-r2-sign]
verify_jwt = true

[functions.media-r2-complete]
verify_jwt = true

[functions.merch-seller]
verify_jwt = true

[functions.merch-checkout]
verify_jwt = true

[functions.merch-stripe-webhook]
verify_jwt = false

[analytics]
enabled = false
